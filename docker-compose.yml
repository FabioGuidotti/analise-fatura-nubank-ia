version: '3.8'

services:
  # Aplicação principal - Análise de Fatura Nubank
  analise-fatura-app:
    build: .
    # Para desenvolvimento local (ignorado no Docker Swarm)
    container_name: analise-fatura-nubank
    restart: always
    # Para produção no Docker Swarm (ignorado no docker-compose)
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - analise_fatura_data:/app/data
      # Volume para desenvolvimento local (ignorado no Docker Swarm)
      - ./uploads:/app/uploads
    networks:
      - traefik-central_traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-central_traefik-public"
      - "traefik.http.routers.analise-fatura.rule=Host(`analise-fatura.ia.dashx.com.br`)"
      - "traefik.http.routers.analise-fatura.entrypoints=websecure"
      - "traefik.http.routers.analise-fatura.tls=true"
      - "traefik.http.routers.analise-fatura.tls.certresolver=myresolver"
      - "traefik.http.services.analise-fatura.loadbalancer.server.port=8501"



# Redes
networks:
  traefik-central_traefik-public:
    external: true  # Usa a rede existente do Traefik

# Volumes
volumes:
  analise_fatura_data:
    name: analise_fatura_data
